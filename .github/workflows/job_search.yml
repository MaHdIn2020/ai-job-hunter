name: Job Search

on:

  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:

  search-jobs:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run job scraper
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
        run: |
          python app.py

      - name: Save feedback memory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/feedback.json

          git diff --cached --quiet || git commit -m "Update job hunter feedback"

          git push
      - name: Commit feedback
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      
          mkdir -p data
      
          if [ ! -f data/feedback.json ]; then
            echo '{"not_related":[],"related":[]}' > data/feedback.json
          fi
      
          git add data/feedback.json
      
          if git diff --cached --quiet; then
            echo "No feedback changes to commit."
            exit 0
          fi
      
          git commit -m "Update job feedback"
      
          git fetch origin main
          git rebase origin/main
      
          git push origin HEAD:main
